<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>學校擺攤庫存管理</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
    background: #f0f4f8; color: #1e293b; padding: 1rem;
  }
  .container { max-width: 800px; margin: 0 auto; }
  
  .header { text-align: center; margin-bottom: 1.5rem; }
  .header h1 { font-size: 1.8rem; color: #0f172a; font-weight: 800; }
  
  .cash-banner {
    background: #fef08a; border: 2px solid #eab308; border-radius: 16px;
    padding: 1rem; display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
  }
  .cash-banner span { font-weight: 800; color: #854d0e; font-size: 1.1rem; }
  .cash-banner input {
    width: 90px; padding: 0.5rem; border: 2px solid #eab308; border-radius: 8px;
    font-size: 1rem; font-weight: 700; color: #854d0e; text-align: center;
  }

  /* 超大分頁按鈕 */
  .tabs { display: flex; gap: 10px; margin-bottom: 1.5rem; }
  .tab-btn {
    flex: 1; padding: 1rem; border: none; background: #e2e8f0; color: #475569;
    font-weight: 800; font-size: 1.1rem; border-radius: 16px; cursor: pointer;
  }
  .tab-btn.active { background: #2563eb; color: white; box-shadow: 0 4px 10px rgba(37,99,235,0.3); }

  .panel { display: none; }
  .panel.active { display: block; }

  .card { background: white; padding: 1.2rem; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 1.5rem; }
  .card h3 { margin-bottom: 1rem; color: #1e293b; font-size: 1.1rem; }
  
  .form-group { margin-bottom: 10px; }
  .form-group label { display: block; font-size: 0.85rem; font-weight: 700; color: #64748b; margin-bottom: 5px; }
  .form-group input, .form-group select {
    width: 100%; padding: 0.8rem; border: 1.5px solid #cbd5e1; border-radius: 10px;
    font-size: 1rem; font-family: inherit;
  }
  
  .btn {
    width: 100%; padding: 1rem; border: none; border-radius: 12px;
    font-size: 1rem; font-weight: 800; color: white; background: #2563eb;
    cursor: pointer; margin-top: 5px;
  }
  .btn:active { transform: scale(0.98); }

  .list-item {
    background: white; padding: 1rem; border-radius: 12px; margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: center;
    border-left: 5px solid #2563eb; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
  }
  .item-info h4 { font-size: 1.1rem; color: #0f172a; margin-bottom: 4px; }
  .item-info p { font-size: 0.85rem; color: #64748b; }
  
  .item-stats { text-align: right; }
  .item-stats .qty { font-size: 1.3rem; font-weight: 800; color: #16a34a; }
  .item-stats .cost { font-size: 0.8rem; color: #d97706; font-weight: 700; }
  
  .delete-btn { background: #fee2e2; color: #dc2626; border: none; padding: 8px 12px; border-radius: 8px; font-weight: 700; margin-left: 10px; cursor: pointer; }

  .empty-text { text-align: center; color: #94a3b8; padding: 2rem; font-weight: 600; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>🏫 擺攤庫存管理</h1>
  </div>

  <div class="cash-banner">
    <div>
      <div style="font-size: 0.8rem; color: #854d0e;">目前手頭現金</div>
      <div style="font-size: 1.5rem; font-weight: 800; color: #854d0e;" id="currentCash">$0</div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="font-size: 0.85rem;">一開始帶：</span>
      <input type="number" id="initialFunds" value="0">
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="btnTabStock" onclick="switchTab('stock')">📦 庫存管理</button>
    <button class="tab-btn" id="btnTabSell" onclick="switchTab('sell')">🛒 賣出記帳</button>
  </div>

  <!-- 庫存管理區塊 -->
  <div id="panelStock" class="panel active">
    <div class="card">
      <h3>📦 新增進貨商品</h3>
      <div class="form-group">
        <label>商品名稱</label>
        <input type="text" id="prodName" placeholder="例如：二手書、可樂">
      </div>
      <div class="form-group">
        <label>進貨數量</label>
        <input type="number" id="prodQty" placeholder="例如：10">
      </div>
      <div class="form-group">
        <label>總共花了多少錢 (成本)</label>
        <input type="number" id="prodCost" placeholder="例如：200">
      </div>
      <button class="btn" onclick="addProduct()">＋ 建立商品與庫存</button>
    </div>

    <h3 style="margin-bottom: 1rem;">目前庫存清單</h3>
    <div id="stockList"></div>
  </div>

  <!-- 賣出記帳區塊 -->
  <div id="panelSell" class="panel">
    <div class="card">
      <h3>🛒 記錄賣出</h3>
      <div class="form-group">
        <label>選擇賣出的商品</label>
        <select id="sellProdId"></select>
      </div>
      <div class="form-group">
        <label>賣出數量</label>
        <input type="number" id="sellQty" value="1" min="1">
      </div>
      <div class="form-group">
        <label>單個賣多少錢 (售價)</label>
        <input type="number" id="sellPrice" placeholder="例如：50">
      </div>
      <button class="btn" onclick="addSale()">＋ 記錄這筆交易</button>
    </div>

    <h3 style="margin-bottom: 1rem;">今天已賣出</h3>
    <div id="salesList"></div>
  </div>

</div>

<script>
  // 資料儲存
  var fundsKey = 'stall_v3_funds';
  var prodsKey = 'stall_v3_prods';
  var salesKey = 'stall_v3_sales';

  var initialFunds = Number(localStorage.getItem(fundsKey)) || 0;
  var products = JSON.parse(localStorage.getItem(prodsKey)) || [];
  var sales = JSON.parse(localStorage.getItem(salesKey)) || [];

  function save() {
    localStorage.setItem(fundsKey, initialFunds);
    localStorage.setItem(prodsKey, JSON.stringify(products));
    localStorage.setItem(salesKey, JSON.stringify(sales));
  }

  function switchTab(tab) {
    document.getElementById('panelStock').classList.remove('active');
    document.getElementById('panelSell').classList.remove('active');
    document.getElementById('btnTabStock').classList.remove('active');
    document.getElementById('btnTabSell').classList.remove('active');

    if (tab === 'stock') {
      document.getElementById('panelStock').classList.add('active');
      document.getElementById('btnTabStock').classList.add('active');
    } else {
      document.getElementById('panelSell').classList.add('active');
      document.getElementById('btnTabSell').classList.add('active');
    }
  }

  function updateUI() {
    document.getElementById('initialFunds').value = initialFunds;
    
    // 計算現金
    var totalProfit = 0;
    sales.forEach(function(s) { totalProfit += (s.price - s.cost); });
    var current = initialFunds + totalProfit;
    document.getElementById('currentCash').innerText = '$' + current;

    // 渲染庫存
    var stockHtml = '';
    var selectHtml = '<option value="">-- 請選擇 --</option>';
    if (products.length === 0) {
      stockHtml = '<div class="empty-text">還沒有商品，請先在上面建立。</div>';
    } else {
      products.forEach(function(p) {
        stockHtml += 
          '<div class="list-item">' +
            '<div class="item-info">' +
              '<h4>' + p.name + '</h4>' +
              '<p>進貨 ' + p.initQty + ' 個 / 單價成本 $' + (p.cost/p.initQty).toFixed(1) + '</p>' +
            '</div>' +
            '<div style="display:flex; align-items:center;">' +
              '<div class="item-stats">' +
                '<div class="qty">剩 ' + p.remainQty + ' 個</div>' +
                '<div class="cost">總花費 $' + p.cost + '</div>' +
              '</div>' +
              '<button class="delete-btn" onclick="deleteProduct(\'' + p.id + '\')">✕</button>' +
            '</div>' +
          '</div>';
        
        if (p.remainQty > 0) {
          selectHtml += '<option value="' + p.id + '">' + p.name + ' (剩 ' + p.remainQty + ' 個)</option>';
        }
      });
    }
    document.getElementById('stockList').innerHTML = stockHtml;
    document.getElementById('sellProdId').innerHTML = selectHtml;

    // 渲染今日賣出
    var today = new Date().toISOString().split('T')[0];
    var salesHtml = '';
    sales.forEach(function(s) {
      if (s.date === today) {
        salesHtml += 
          '<div class="list-item">' +
            '<div class="item-info">' +
              '<h4>' + s.name + ' (賣出 ' + s.qty + ' 個)</h4>' +
              '<p>成本: $' + s.cost + ' | 售價: $' + s.price + '</p>' +
            '</div>' +
            '<div style="display:flex; align-items:center;">' +
              '<div class="item-stats">' +
                '<div class="qty" style="color:#2563eb;">利潤 $' + (s.price - s.cost) + '</div>' +
              '</div>' +
              '<button class="delete-btn" onclick="deleteSale(\'' + s.id + '\')">✕</button>' +
            '</div>' +
          '</div>';
      }
    });
    if (salesHtml === '') salesHtml = '<div class="empty-text">今天還沒賣出東西。</div>';
    document.getElementById('salesList').innerHTML = salesHtml;
  }

  document.getElementById('initialFunds').oninput = function() {
    initialFunds = Number(this.value) || 0;
    save(); updateUI();
  };

  function addProduct() {
    var name = document.getElementById('prodName').value.trim();
    var qty = parseInt(document.getElementById('prodQty').value);
    var cost = parseFloat(document.getElementById('prodCost').value);

    if (!name || isNaN(qty) || qty <= 0 || isNaN(cost) || cost < 0) {
      alert('請完整填寫商品名稱、數量與成本！'); return;
    }

    products.push({
      id: Date.now().toString(),
      name: name,
      initQty: qty,
      remainQty: qty,
      cost: cost
    });
    
    save(); updateUI();
    document.getElementById('prodName').value = '';
    document.getElementById('prodQty').value = '';
    document.getElementById('prodCost').value = '';
    alert('商品建立成功！');
  }

  function deleteProduct(id) {
    if(confirm('確定刪除此商品？')) {
      products = products.filter(function(p) { return p.id !== id; });
      save(); updateUI();
    }
  }

  function addSale() {
    var id = document.getElementById('sellProdId').value;
    var qty = parseInt(document.getElementById('sellQty').value);
    var price = parseFloat(document.getElementById('sellPrice').value);

    if (!id || isNaN(qty) || qty <= 0 || isNaN(price) || price < 0) {
      alert('請選擇商品並填寫正確的數量與售價！'); return;
    }

    var prod = products.find(function(p) { return p.id === id; });
    if (prod.remainQty < qty) {
      alert('庫存不足！只剩 ' + prod.remainQty + ' 個。'); return;
    }

    var unitCost = prod.cost / prod.initQty;
    prod.remainQty -= qty;

    sales.push({
      id: Date.now().toString(),
      prodId: id,
      name: prod.name,
      qty: qty,
      cost: unitCost * qty,
      price: price * qty,
      date: new Date().toISOString().split('T')[0]
    });

    save(); updateUI();
    document.getElementById('sellQty').value = '1';
    document.getElementById('sellPrice').value = '';
    alert('賣出記錄成功！');
  }

  function deleteSale(id) {
    if(confirm('確定刪除這筆交易？庫存會加回去喔。')) {
      var sale = sales.find(function(s) { return s.id === id; });
      if (sale) {
        var prod = products.find(function(p) { return p.id === sale.prodId; });
        if (prod) prod.remainQty += sale.qty;
      }
      sales = sales.filter(function(s) { return s.id !== id; });
      save(); updateUI();
    }
  }

  // 初始化
  updateUI();
</script>
</body>
</html>
